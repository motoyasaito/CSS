<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>HTMLCSS総合2</title>
    <link rel="stylesheet" href="htmlcss2.css">
  </head>
  <body>
    <div class="background">
      <header class="header">
        <h1 class="header-title">情報ページ</h1>
        <p class="header-exp">シンプルで整ったデザインのページを作成します。</p>
      </header>
      <div class="cards">
        <div class="card1">
          <h2 class="card-title1">タイトル1</h2>
          <p class="card-text1">これは最初の情報カードです</p>
        </div>
        <div class="card2">
          <h2 class="card-title2">タイトル2</h2>
          <p class="card-text2">これは2番目の情報カードです</p>
        </div>
        <div class="card3">
          <h2 class="card-title3">タイトル3</h2>
          <p class="card-text3">これは3番目の情報カードです</p>
        </div>
      </div>
      <div class="table-section">
        <h2 class="table-title">データ一覧</h2>
        <table class="table-main">
          <thead class="table-head">
            <tr class="table-tr1">
              <th class="table-th1">項目</th>
              <th>説明</th>
              <th>データ</th>
            </tr>
          </thead>
          <tbody>
            <tr class="table-tr2">
              <td class="table-td1">項目1</td>
              <td>説明1</td>
              <td>データ1</td>
            </tr>
            <tr class="table-tr3">
              <td class="table-td2">項目2</td>
              <td>説明2</td>
              <td>データ2</td>
            </tr>
            <tr class="table-tr4">
              <td class="table-td3">項目3</td>
              <td>説明3</td>
              <td>データ3</td>
          </tbody>
        </table>
      </div>
    </div>
  </body>
